# Trivy ignore file for the api image gate (CI job `image`: HIGH/CRITICAL with a fix available fails).
# Loaded explicitly with --ignorefile .trivyignore.yaml: the YAML form scopes each entry to exact paths and
# carries a reason and an expiry, which the plain .trivyignore format cannot.
# Rules for every entry:
#   - one entry per finding, scoped with `paths` to the files that contain it (never image-wide)
#   - `statement` = VEX justification (CISA "Minimum Requirements for VEX", 2023) + the fix that removes it
#   - `expired_at` at most ~5 weeks out: an expired entry stops suppressing and the gate fails again
#   - delete entries when the fix lands (Trivy does not report unused entries)
# Suppressed findings stay visible: the gate runs with --show-suppressed and the full JSON report is kept.
#
# Measured 2026-09-28 with Trivy 0.74.0 on the image built from fc1fe66 (all 34 ids below have fixes).

vulnerabilities:
  - id: CVE-2024-24790 # CRITICAL · stdlib v1.20.7
    paths:
      - "app/node_modules/.pnpm/@esbuild+linux-*@0.18.20/node_modules/@esbuild/linux-*/bin/esbuild"
    expired_at: 2026-10-31
    statement: &esbuild >-
      Go standard library compiled into an esbuild binary (build tooling). It reaches the runtime image only
      because pnpm deploy links better-auth's optional peer dependencies (drizzle-kit, vitest) into
      node_modules; nothing executes it at runtime (CMD node dist/index.js, pre-deploy node dist/migrate.js
      and dist/seed.js). VEX: not_affected, vulnerable_code_not_in_execute_path. Fix: keep dev tooling out
      of the runtime stage of apps/api/Dockerfile.
