name: ci

on:
  push:
    # dev → testing → staging → main (promote ทีละขั้นด้วย merge commit ผ่าน PR promotion) · release ออกจาก main เท่านั้น
    branches: [main, staging, testing, dev]
  pull_request:
  # ขั้น sync หลัง release สั่งรันบน branch ที่ขยับ (push ด้วย GITHUB_TOKEN ไม่ trigger ci เอง) · รันซ้ำเองได้
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# actions ปักที่ commit SHA (กัน tag ถูกย้าย) — Renovate (helpers:pinGitHubActionDigests) อัปเดตให้พร้อมคอมเมนต์เวอร์ชัน
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # เทสต์ของ apps/api ใช้ Postgres จริง (สร้าง database ต่อไฟล์เทสต์) — รุ่นเดียวกับ Railway
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ong
          POSTGRES_PASSWORD: ong
          POSTGRES_DB: ong
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ong" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ong:ong@localhost:5432/postgres
      # เทสต์แปลง PDF ภาษาไทยจริง — ตั้งไว้แล้ว = ต้องมี Gotenberg (ต่อไม่ได้ = fail ไม่ข้าม)
      TEST_GOTENBERG_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint ต้องเห็นประวัติ
          persist-credentials: false
      # Gotenberg จาก services/gotenberg/Dockerfile ตัวเดียวกับ Railway (FROM ปัก digest · ฟอนต์ Sarabun · basic auth)
      # ไม่ใช้ services: เพราะต้อง build และส่ง flag เอง · ดึง image (~700 MB) เบื้องหลังระหว่าง install/lint/typecheck
      - name: start gotenberg (background)
        run: |
          { docker build -q -t ong-gotenberg services/gotenberg \
            && docker run -d --name gotenberg -p 3000:3000 \
              -e GOTENBERG_API_BASIC_AUTH_USERNAME=ong -e GOTENBERG_API_BASIC_AUTH_PASSWORD=ongongong ong-gotenberg
          } > "$RUNNER_TEMP/gotenberg.log" 2>&1 &
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — เวอร์ชัน pnpm จาก packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: commitlint (PR)
        if: github.event_name == 'pull_request'
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$FROM" --to "$TO" --verbose
      - name: commitlint (push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        # branch ใหม่ / force-push → ไม่มี commit ก่อนหน้าให้เทียบ → ตรวจตัวล่าสุด
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          else
            pnpm exec commitlint --last --verbose
          fi

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: wait for gotenberg
        run: |
          for _ in $(seq 1 120); do
            curl -fsS http://localhost:3000/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/gotenberg.log"; docker logs gotenberg || true
          exit 1
      - run: pnpm test
      - run: pnpm build

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: release
    permissions:
      contents: write # tag + GitHub Release + commit CHANGELOG.md + sync branches
      actions: write # สั่ง ci บน branch ที่ sync แล้ว
      issues: write # คอมเมนต์ใน issue ที่ถูกปิดโดย release
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # ไม่ใช้ cache ใน job ที่มีสิทธิ์เขียน — กัน cache poisoning
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release commit (CHANGELOG.md) อยู่บน main แล้ว — ไล่ตามลำดับ promotion: staging ← main · testing ← staging · dev ← testing
      # merge --no-ff เสมอ (ข้ามถ้า merge เข้าไปแล้ว) → ได้ merge commit เป็นขั้น ๆ ไม่ fast-forward
      # push ด้วย GITHUB_TOKEN ไม่ trigger ci → สั่ง ci เองบน branch ที่ขยับ
      - name: sync branches with main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q "$remote" "+refs/heads/*:refs/remotes/origin/*"
          upstream=origin/main
          for branch in staging testing dev; do
            if ! git rev-parse --verify -q "origin/$branch" >/dev/null; then
              echo "skip $branch (no such branch)"
              continue
            fi
            git checkout -q -B "$branch" "origin/$branch"
            if git merge-base --is-ancestor "$upstream" HEAD; then
              echo "skip $branch ($upstream อยู่ใน $branch แล้ว)"
            else
              git merge --no-ff --no-edit "$upstream"
              git push "$remote" "HEAD:$branch"
              gh workflow run ci.yml --ref "$branch"
            fi
            upstream=$branch
          done
