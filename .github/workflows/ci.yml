name: ci

on:
  push:
    # dev → testing → staging → main (promote แบบ fast-forward) · release ออกจาก main เท่านั้น
    branches: [main, staging, testing, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# actions ปักที่ commit SHA (กัน tag ถูกย้าย) — dependabot อัปเดตให้พร้อมคอมเมนต์เวอร์ชัน
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint ต้องเห็นประวัติ
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — เวอร์ชัน pnpm จาก packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: commitlint (PR)
        if: github.event_name == 'pull_request'
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$FROM" --to "$TO" --verbose
      - name: commitlint (push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        # branch ใหม่ / force-push → ไม่มี commit ก่อนหน้าให้เทียบ → ตรวจตัวล่าสุด
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          else
            pnpm exec commitlint --last --verbose
          fi

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: release
    permissions:
      contents: write # tag + GitHub Release + commit CHANGELOG.md + sync branches
      issues: write # คอมเมนต์ใน issue ที่ถูกปิดโดย release
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # ไม่ใช้ cache ใน job ที่มีสิทธิ์เขียน — กัน cache poisoning
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release commit (CHANGELOG.md) อยู่บน main แล้ว — ดึง staging/testing/dev ตามให้ promote ครั้งหน้ายัง fast-forward ได้
      # ปกติเป็น fast-forward · ถ้า branch มี commit ใหม่ระหว่างนั้นจะเป็น merge commit (CHANGELOG ไม่ชนกับงานบน branch)
      - name: sync branches with main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch "$remote" main:refs/remotes/origin/main
          for branch in staging testing dev; do
            if ! git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null; then
              echo "skip $branch (no such branch)"
              continue
            fi
            git fetch "$remote" "$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "origin/$branch"
            git merge --no-edit origin/main
            git push "$remote" "HEAD:$branch"
          done
