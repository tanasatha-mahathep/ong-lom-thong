version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    commit-message:
      prefix: chore
      include: scope
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/apps/api, /services/gotenberg]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    commit-message:
      prefix: build
      include: scope
    ignore:
      # node / gotenberg major ต้องอัปเองพร้อม .node-version และทดสอบ PDF กับใบจริง
      - dependency-name: "*"
        update-types: [version-update:semver-major]
