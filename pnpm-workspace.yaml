packages:
  - apps/*
  - packages/*
  - tests/*

# เวอร์ชันเดียวทั้ง repo — package ที่ใช้อ้างด้วย "catalog:" (tests/e2e · apps/web) → browser build เดียว · Renovate อัปที่เดียว
catalog:
  "@axe-core/playwright": 4.13.0
  "@playwright/test": 1.63.0

onlyBuiltDependencies:
  - esbuild

# release-notes-generator 14.x ใช้ conventional-changelog-writer 8 ซึ่ง render preset v10 ไม่ได้
# plugin โหลด preset จาก directory ของตัวเองก่อน → ให้แต่ละ plugin มี preset v9 เป็น dependency ของตัวเอง
# (preset v10 ยังอยู่สำหรับ @commitlint/config-conventional) — ถอดได้เมื่อ generator ขยับไป writer 9
packageExtensions:
  "@semantic-release/commit-analyzer":
    dependencies:
      conventional-changelog-conventionalcommits: ^9.3.1
  "@semantic-release/release-notes-generator":
    dependencies:
      conventional-changelog-conventionalcommits: ^9.3.1
