services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # ตรงกับ Railway postgres() (postgres-ssl:18)
    environment:
      POSTGRES_DB: ong
      POSTGRES_USER: ong
      POSTGRES_PASSWORD: ong
    ports:
      - "5432:5432"
    volumes:
      # PG 18 ย้าย PGDATA ไปใต้ /var/lib/postgresql/18 — mount ที่ระดับนี้ตามคำแนะนำของ image
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ong"]
      interval: 5s
      timeout: 3s
      retries: 10

  gotenberg:
    build: ./services/gotenberg
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: ong
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ongongong
    ports:
      - "3000:3000"

  # object storage แบบ S3 (RustFS) — local แทน Railway bucket · รับแค่ path-style (S3_FORCE_PATH_STYLE=true)
  # host port 9100/9101 ไม่ใช่ 9000/9001 — php-fpm ของ Homebrew ฟัง 127.0.0.1:9000 อยู่
  s3:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      # ต้องตรงกับ S3_ACCESS_KEY / S3_SECRET_KEY ใน .env.example
      RUSTFS_ACCESS_KEY: ong
      RUSTFS_SECRET_KEY: ongongong
      RUSTFS_CONSOLE_ENABLE: "true"
      # log ออก stdout ให้ make logs SVC=s3 เห็น — ค่า default ของ image เขียนลงไฟล์ /logs ในคอนเทนเนอร์
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "9100:9000" # S3 API
      - "9101:9001" # console → http://localhost:9101/rustfs/console/
    volumes:
      # image รันเป็น user rustfs (uid 10001) — named volume ใหม่รับ owner ของ /data จาก image จึงเขียนได้
      - s3data:/data

  # สร้าง bucket `ong` แล้วจบ (ไม่ใช้ mc) — ลองซ้ำจน s3 ตอบ · รันซ้ำได้: bucket ที่มีอยู่แล้ว RustFS ตอบ 200
  # โดยไม่แตะค่าเดิม (แบบ AWS us-east-1) · S3 เจ้าอื่นตอบ 409 BucketAlreadyOwnedByYou/BucketAlreadyExists = สำเร็จ
  s3-init:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    depends_on:
      - s3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 60); do
          r=$$(curl -s -w ' HTTP%{http_code}' --aws-sigv4 aws:amz:auto:s3 --user ong:ongongong -X PUT http://s3:9000/ong)
          case "$$r" in
            *HTTP200 | *BucketAlreadyOwnedByYou* | *BucketAlreadyExists*) echo 'bucket ong ready'; exit 0 ;;
          esac
          sleep 1
        done
        echo "bucket ong not created: $$r" >&2
        exit 1

volumes:
  pgdata18:
  s3data:
