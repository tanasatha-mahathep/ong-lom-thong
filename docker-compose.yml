services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ong
      POSTGRES_USER: ong
      POSTGRES_PASSWORD: ong
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ong"]
      interval: 5s
      timeout: 3s
      retries: 10

  gotenberg:
    build: ./services/gotenberg
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: ong
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ongongong
    ports:
      - "3000:3000"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ong
      MINIO_ROOT_PASSWORD: ongongong
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ong ongongong >/dev/null 2>&1; do sleep 1; done;
      mc mb -p local/ong >/dev/null 2>&1 || true;
      echo 'bucket ong ready';
      "

volumes:
  pgdata:
  miniodata:
